name: Continuous Integration

on:
  pull_request:
    branches: [ development ]

env:
  DOTNET_NOTLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  ci:
    name: Compile and run tests
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
    steps:
    - name: Checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # 4.2.2

    - name: Setup dotnet
      uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # 4.3.0
      with:
        global-json-file: ./src/global.json

    - name: Restore
      working-directory: ./src
      run: dotnet restore

    - name: Build
      working-directory: ./src/Utilities
      run: dotnet build --configuration Release --no-restore --warnaserror

    - name: Test
      working-directory: ./src/Utilities.Test
      run: dotnet run --configuration Release --no-restore --report-trx

    - name: Publish results
      uses: EnricoMi/publish-unit-test-result-action@170bf24d20d201b842d7a52403b73ed297e6645b # 2.18.0
      if: always()
      with:
        files: |
          **/*.trx
